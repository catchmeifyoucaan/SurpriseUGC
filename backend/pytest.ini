[pytest]
# Pytest Configuration for ViralForge.ai Backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Strict markers
    --strict-markers
    # Coverage options
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    # Warnings
    -W error::UserWarning
    # Disable warnings for third-party packages
    -p no:warnings
    # Show slowest 10 tests
    --durations=10
    # Color output
    --color=yes

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, external APIs)
    slow: Slow tests (> 1 second)
    api: API endpoint tests
    security: Security-related tests
    ai: AI service tests

# Asyncio configuration
asyncio_mode = auto

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
